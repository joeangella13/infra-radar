name: Daily brief

on:
  schedule:
    # 10:30 UTC on weekdays = 6:30am ET while US daylight saving is in effect
    # (5:30am ET Nov-Mar; change to '30 11 * * 1-5' in winter if you care).
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of news to cover'
        required: false
        default: '2'

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # lifted to job env so the email step can test for it — the `secrets`
    # context is not available inside a step-level `if`
    env:
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Self test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate.py --selftest

      - name: Generate today's items
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '2' }}
          MAX_SEARCHES: '14'
        run: python scripts/generate.py

      - name: Export markdown archive
        run: python scripts/export_markdown.py

      - name: Build email
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/email_summary.py

      - name: Commit archive
        run: |
          git config user.name  "infra-radar-bot"
          git config user.email "actions@github.com"
          git add data/ archive/
          if git diff --staged --quiet; then
            echo "no archive changes"
          else
            git commit -m "brief: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Read email payload
        id: mail
        run: |
          echo "subject=$(cat out/email_subject.txt)" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<INFRA_RADAR_EOF'
            cat out/email.html
            echo ''
            echo 'INFRA_RADAR_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send morning email
        if: ${{ env.MAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Infra Radar
          to: ${{ vars.EMAIL_TO }}
          subject: ${{ steps.mail.outputs.subject }}
          html_body: ${{ steps.mail.outputs.body }}

      - name: Job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open('out/run.json'))
          print(f"## {r['run_date']} — {r['added']} new items ({r['total']} in archive)")
          print()
          print(r.get('coverage_note', ''))
          print()
          for i in r['new_items']:
              flag = "◆ " if i.get('flags') else ""
              print(f"- {flag}[{i['headline']}]({i['url']}) — `{i['section']}`")
          PY
